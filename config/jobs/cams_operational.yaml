# 241 production. Credentials are existing files, never values in this config.
# Source/area/52 variables/native leads are fixed in cams/catalogue.py.
output_dir: /climate_data
accounts:
  - name: zmy
    credential_file: /workspace/era5-download/.cdsapirc_zmy
  - name: zhangzomo
    credential_file: /workspace/era5-download/.cdsapirc_zhangzomo
  - name: zomo
    credential_file: /workspace/era5-download/.cdsapirc_zomo
cycle_accounts: {0: zmy, 12: zhangzomo}
history_accounts: [zmy, zhangzomo, zomo]
max_active_orders_per_account: 1
first_init: "2026102100"
lookback_days: 1
publish_lag_hours: 10
poll_seconds: 30
max_run_seconds: 2400
transfer_seconds: 240
max_asset_bytes: 1073741824
# Verified MARS count/empty-diagnostic failures share this per-chain AND per-init cap.
# Wait 30 minutes after a confirmed failure; waiting never holds the account.
mars_count_retry_limit: 48
mars_count_retry_delay_seconds: 1800
# One shared 24-hour window from the init's first verified recoverable failure.
mars_count_retry_window_seconds: 86400
generic_mars_retry_enabled: true
# Retain unknown POST receipts as isolated gaps; this never grants another POST.
quarantine_uncertain_submissions: true
# Positively identified deleted/dismissed orders get one identical replacement per init.
deleted_order_retry_limit: 1
mars_count_retry_delays_seconds: [1800, 1800, 1800, 1800, 1800, 1800, 1800, 1800,
  1800, 1800, 1800, 1800, 1800, 1800, 1800, 1800,
  1800, 1800, 1800, 1800, 1800, 1800, 1800, 1800,
  1800, 1800, 1800, 1800, 1800, 1800, 1800, 1800,
  1800, 1800, 1800, 1800, 1800, 1800, 1800, 1800,
  1800, 1800, 1800, 1800, 1800, 1800, 1800, 1800]
# New realtime groups use disjoint ADS native cubes; existing orders keep their IDs.
hourly_request_mode: native_constraint_cubes
# Parallel byte ranges of the same asset; does not add ADS orders or workers.
transfer_connections: 4
