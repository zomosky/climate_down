# Independent IFS 0.1-degree Google source; date/cycle are supplied by the host.
# Native 00/12 UTC ladder: 0..144 by 3 h, then 150..360 by 6 h (85 leads).
# No changes to ifs-hres 0.25-degree jobs.
source: ifs_0p1
time:
  cycle: 12
  steps: all
variables:
- name: wind_100m
  levtype: sfc
  params:
  - 100u
  - 100v
- name: wind_10m
  levtype: sfc
  params:
  - 10u
  - 10v
- name: wind_gust_10m
  levtype: sfc
  params:
  - 10fg
- name: pl_850
  levtype: pl
  levels:
  - '850'
  params:
  - u
  - v
  - t
  - q
  - r
  - gh
- name: temp_2m
  levtype: sfc
  params:
  - 2t
- name: temp_skin
  levtype: sfc
  params:
  - skt
- name: temp_minmax_3h
  levtype: sfc
  params:
  - mn2t3
  - mx2t3
- name: humidity_2m
  levtype: sfc
  params:
  - 2d
- name: pressure_sfc
  levtype: sfc
  params:
  - sp
- name: pressure_msl
  levtype: sfc
  params:
  - msl
- name: radiation_surface
  levtype: sfc
  params:
  - ssrd
  - strd
  - ssr
  - str
  - ttr
- name: cloud_total
  levtype: sfc
  params:
  - tcc
- name: precip
  levtype: sfc
  params:
  - tp
  - cp
  - sf
  - ro
- name: tcwv_column
  levtype: sfc
  params:
  - tcwv
- name: cape
  levtype: sfc
  params:
  - mucape
download:
  output_dir: /climate_data
  workers: 8
  gap_tolerance: 0
  timeout_seconds: 120
  max_attempts: 4
  init_concurrency: 1
